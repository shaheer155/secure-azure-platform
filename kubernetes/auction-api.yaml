
apiVersion: v1
kind: Namespace
metadata:
  name: auctions
  labels:
    app.kubernetes.io/part-of: auction-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auction-api
  namespace: auctions
  labels:
    app: auction-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: auction-api

  template:
    metadata:
      labels:
        app: auction-api

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: democr.azurecr.io/auction-api:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auction-api-secrets
                  key: DB_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: auction-api
  namespace: auctions
spec:
  type: ClusterIP

  selector:
    app: auction-api

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
