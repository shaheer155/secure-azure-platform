
name: Terraform CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-checks:
    name: Terraform Checks and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true

  terraform-plan:
    name: Terraform Plan
    needs: terraform-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Initialize
        run: terraform init -backend-config="environments/dev/backend.hcl"
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true

      - name: Terraform Plan
        run: terraform plan -var-file="environments/dev/terraform.tfvars"
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true

  terraform-apply:
    name: Terraform Apply
    needs: terraform-checks
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Initialize
        run: terraform init -backend-config="environments/dev/backend.hcl"
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true

      - name: Terraform Apply
        run: terraform apply -var-file="environments/dev/terraform.tfvars" -auto-approve
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
